name: Probe tray session end MSI

# Fork-only probe (forum 22853 #9): builds two MSIs from the fix and upgrades
# from one to the other with the tray icon running.
on:
  push:
    branches: [probe/msi-running-tray]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ["2.4.1.199", "2.4.1.200"]
    name: build ${{ matrix.version }}
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
      - uses: actions/checkout@v7
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add --global WixToolset.UI.wixext/6.0.2
      - name: Build
        shell: bash
        working-directory: ./ReleaseBuilder
        env:
          UPDATER_KEYFILE: ./testfile.key1
          WIX:
          VERSION: ${{ matrix.version }}
        run: |
          echo "## Changed" > ./changelog-news.txt
          dotnet run -- build debug --targets win-x64-gui.msi --git-stash-push=false --disable-docker-push=true --keep-builds=true --disable-authenticode=true --disable-signcode=true --disable-notarize-signing=true --disable-gpg-signing=true --disable-s3-upload=true --disable-github-upload=true --disable-update-server-reload=true --disable-discourse-announce=true --disable-clean-source=true --password=test1234 --version=$VERSION
          mkdir -p ../msi && find .. -name '*.msi' -not -path '../msi/*' -not -path '*/node_modules/*' -exec cp {} ../msi/ \;
          ls -la ../msi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-${{ matrix.version }}
          path: msi/*.msi
          retention-days: 1

  upgrade:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rm: [default, rmapi]
    name: upgrade with the tray icon running (${{ matrix.rm }})
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msi-2.4.1.199
          path: first
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msi-2.4.1.200
          path: second
      - name: Upgrade
        shell: pwsh
        env:
          RM: ${{ matrix.rm }}
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Rm {
            [StructLayout(LayoutKind.Sequential)] public struct FILETIME { public uint Low; public uint High; }
            [StructLayout(LayoutKind.Sequential)] public struct RM_UNIQUE_PROCESS { public int dwProcessId; public FILETIME ProcessStartTime; }
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)] public struct RM_PROCESS_INFO {
              public RM_UNIQUE_PROCESS Process;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 256)] public string strAppName;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 64)] public string strServiceShortName;
              public int ApplicationType; public uint AppStatus; public uint TSSessionId;
              [MarshalAs(UnmanagedType.Bool)] public bool bRestartable; }
            [DllImport("rstrtmgr.dll", CharSet = CharSet.Unicode)] public static extern int RmStartSession(out uint h, int f, System.Text.StringBuilder key);
            [DllImport("rstrtmgr.dll", CharSet = CharSet.Unicode)] public static extern int RmRegisterResources(uint h, uint n, string[] files, uint a, IntPtr b, uint c, string[] d);
            [DllImport("rstrtmgr.dll")] public static extern int RmGetList(uint h, out uint needed, ref uint n, [In, Out] RM_PROCESS_INFO[] info, ref uint reasons);
            [DllImport("rstrtmgr.dll")] public static extern int RmShutdown(uint h, uint flags, IntPtr cb);
            [DllImport("rstrtmgr.dll")] public static extern int RmEndSession(uint h);
            public static string Run(string file, uint flags) {
              uint h; var key = new System.Text.StringBuilder(64);
              var log = "start=" + RmStartSession(out h, 0, key);
              log += " register=" + RmRegisterResources(h, 1, new[] { file }, 0, IntPtr.Zero, 0, null);
              uint needed, n = 10, reasons = 0; var info = new RM_PROCESS_INFO[10];
              log += " list=" + RmGetList(h, out needed, ref n, info, ref reasons) + " reasons=" + reasons;
              for (int i = 0; i < n; i++) log += " [pid=" + info[i].Process.dwProcessId + " app=" + info[i].strAppName + " type=" + info[i].ApplicationType + " status=" + info[i].AppStatus + "]";
              log += " shutdown=" + RmShutdown(h, flags, IntPtr.Zero);
              RmEndSession(h);
              return log;
            }
          }
          '@
          function Run-Msi($label, $msi) {
            $log = Join-Path $env:RUNNER_TEMP "$label.log"
            $p = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart', '/l*v', $log) -Wait -PassThru
            "EXIT $label $($p.ExitCode)"
            Get-Content $log | Select-String -Pattern 'RESTART MANAGER|Return value 3|Installation success or error|Error 1\d\d\d\.' | ForEach-Object { "LOG $label " + $_.Line.Trim() } | Select-Object -First 20
          }
          function Show-State($label) {
            Get-Process | Where-Object { $_.ProcessName -like 'Duplicati*' } | ForEach-Object { "PROC $label pid=$($_.Id) name=$($_.ProcessName) start=$($_.StartTime.ToString('HH:mm:ss'))" }
            $exe = 'C:\Program Files\Duplicati 2\Duplicati.GUI.TrayIcon.exe'
            if (Test-Path $exe) { "DISK $label TrayIcon.exe " + (Get-Item $exe).VersionInfo.FileVersion }
            $l = Get-NetTCPConnection -LocalPort 8200 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
            "PORT $label 8200 owner=" + $(if ($l) { $l.OwningProcess } else { 'none' })
          }
          $m1 = (Get-ChildItem first -Filter '*.msi' | Select-Object -First 1).FullName
          $m2 = (Get-ChildItem second -Filter '*.msi' | Select-Object -First 1).FullName
          "MSI $m1"; "MSI $m2"
          Run-Msi 'first' $m1
          Show-State 'installed'
          $exe = 'C:\Program Files\Duplicati 2\Duplicati.GUI.TrayIcon.exe'
          $t = Start-Process $exe -PassThru -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'tray.out') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'tray.err')
          for ($i = 0; $i -lt 90; $i++) { if (Get-NetTCPConnection -LocalPort 8200 -State Listen -ErrorAction SilentlyContinue) { break }; Start-Sleep 1 }
          Start-Sleep 5
          "WAITED $i s, pid $($t.Id), alive $(-not $t.HasExited)"
          Show-State 'running'
          if ($env:RM -eq 'rmapi') { "RM " + [Rm]::Run($exe, 0); Start-Sleep 10; $t.Refresh(); "AFTER-RM alive $(-not $t.HasExited)" }
          Run-Msi 'second' $m2
          Start-Sleep 5
          $t.Refresh()
          "AFTER alive $(-not $t.HasExited)" + $(if ($t.HasExited) { " exitcode $($t.ExitCode)" } else { "" })
          Show-State 'upgraded'
          Get-Content (Join-Path $env:RUNNER_TEMP 'tray.out'), (Join-Path $env:RUNNER_TEMP 'tray.err') -ErrorAction SilentlyContinue | Select-Object -Last 15 | ForEach-Object { "TRAY $_" }
          exit 0
